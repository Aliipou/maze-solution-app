name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1

  build-firmware:
    name: Validate Firmware Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check platformio.ini exists
        run: test -f firmware/platformio.ini && echo "firmware config present"
